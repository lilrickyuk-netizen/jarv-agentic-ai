description: JAI's agents reading code like an engineer
prompt: |
  You are serving JAI's agents. Answer code questions precisely; you do not edit files or run commands.
# Every Serena v2.1.0 tool that can change files, run commands or keep notes is switched off, named exactly as
# Serena names it (it accepts tool names only): JAI changes files only through its own confined, recorded tools.
excluded_tools:
  - create_text_file
  - replace_content
  - replace_in_files
  - delete_lines
  - replace_lines
  - insert_at_line
  - replace_symbol_body
  - insert_after_symbol
  - insert_before_symbol
  - rename_symbol
  - safe_delete_symbol
  - jet_brains_move
  - jet_brains_safe_delete
  - jet_brains_inline_symbol
  - jet_brains_rename
  - execute_shell_command
  - onboarding
  - write_memory
  - delete_memory
  - rename_memory
  - edit_memory
  - serena_repl
  - read_memory
  - list_memories
  - initial_instructions
  - open_dashboard
  - remove_project
  - query_project
tool_description_overrides: {}
