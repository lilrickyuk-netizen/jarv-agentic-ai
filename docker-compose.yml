services:
  # PostgreSQL Database with pgvector
  postgres:
    image: ankane/pgvector:latest
    container_name: jarv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarv_password}
      POSTGRES_DB: ${POSTGRES_DB:-jarv}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarv}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarv-network

  # Redis for caching and job queue
  redis:
    image: redis:7-alpine
    container_name: jarv-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarv-network

  # Restricted Docker API for JARV's self-healing (Repair 12d). Exposes only
  # container list/inspect/logs and restart; image, exec, volume, network and
  # all other write endpoints stay denied (POST=0). Reachable only from the
  # internal jarv-ops network (backend and worker), never published to the host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: jarv-docker-proxy
    environment:
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      # Start and stop only: JAI's backend lets Richard switch its heavy services (docker_ops.SWITCHABLE) on and
      # off from the Command Center; it refuses every other container.
      ALLOW_START: 1
      ALLOW_STOP: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The proxy's rules with start and stop checked before the general refusal of POSTs (see the file).
      - ./infra/docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      - jarv-ops
    restart: unless-stopped

  # FastAPI Backend
  # Database migrations: runs `alembic upgrade head` once and exits; the backend, worker and
  # scheduler start only after it succeeds.
  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        JARV_UID: ${JARV_UID:-1000}
        JARV_GID: ${JARV_GID:-1000}
    container_name: jarv-migrate
    command: python -m alembic upgrade head
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jarv}:${POSTGRES_PASSWORD:-jarv_password}@postgres:5432/${POSTGRES_DB:-jarv}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - ./apps/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jarv-network
    restart: "no"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        JARV_UID: ${JARV_UID:-1000}
        JARV_GID: ${JARV_GID:-1000}
    container_name: jarv-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jarv}:${POSTGRES_PASSWORD:-jarv_password}@postgres:5432/${POSTGRES_DB:-jarv}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      # LLM provider keys are read from the mounted apps/backend/.env. Do not
      # set them here with empty defaults — an empty env var would take
      # precedence over the .env file and blank out the configured key.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Real read-only workspace inspection. WORKSPACE_HOST_ROOT is the host path
      # operators type in commands; it is bind-mounted read-only at the container
      # path below. JARV only inspects approved workspaces inside this root.
      WORKSPACE_HOST_ROOT: ${WORKSPACE_HOST_ROOT:-C:\\Users\\lilri\\OneDrive\\Desktop}
      WORKSPACE_CONTAINER_ROOT: /host/workspaces
      VOICEBOX_BASE_URL: ${VOICEBOX_BASE_URL:-}
      CRAWL4AI_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      # Wave 6: the tokens of JAI's model gateway and of its document, browser, knowledge and prompt-check services.
      JAI_GATEWAY_TOKEN: ${JAI_GATEWAY_TOKEN:-}
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}
      KNOWLEDGE_TOKEN: ${KNOWLEDGE_TOKEN:-}
      PROMPTFOO_TOKEN: ${PROMPTFOO_TOKEN:-}
      OPENHANDS_TOKEN: ${OPENHANDS_TOKEN:-}
      VOICEBOX_PROFILE_ID: ${VOICEBOX_PROFILE_ID:-}
      WAKEWORD_MODEL_DIR: /data/voice-models/sherpa-kws-gigaspeech
      # Operations (Repair 12d): restricted Docker API and database backups.
      DOCKER_OPS_URL: http://docker-proxy:2375
      BACKUP_DIR: /data/backups
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/backend:/app
      # JAI's own upgrade history (read-only), so it can say what has been installed into it.
      - ./.git:/repo/.git:ro
      # The skill packs (Upgrades 1-5) for JAI's knowledge library; read-only.
      - ./skill-packs:/data/skill-packs:ro
      - voice_models:/data/voice-models
      - backups:/data/backups
      - voice_audio:/data/voice-audio
      # JARV's tool home: tools, language versions and package caches it installs persist here.
      - tool_home:/home/jarv
      # Approved workspace root. Mounted read-write so JARV can perform
      # AUTHORITY-GATED, scope-checked file writes inside approved workspaces.
      # Safety is enforced in-app (registered-workspace allowlist + banned/secret
      # denylist + audit + FileChange records); writes outside scope are blocked.
      # WORKSPACE_MOUNT_SOURCE is the folder as Docker sees it (the WSL path to
      # the Windows Desktop by default); WORKSPACE_HOST_ROOT above is the same
      # folder as typed in commands. Long syntax so a drive letter can never be
      # misread as a separator.
      - type: bind
        source: ${WORKSPACE_MOUNT_SOURCE:-/mnt/c/Users/lilri/OneDrive/Desktop}
        target: /host/workspaces
    networks:
      - jarv-network
      - jarv-ops
      - jarv-web
      - jarv-gpu
      - jarv-voice
      - jarv-code
      - jarv-knowledge
    restart: unless-stopped

  # Next.js Dashboard Frontend
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: jarv-dashboard
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      JARV_BACKEND_URL: http://backend:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - jarv-network
    restart: unless-stopped
    # Liveness only: probe the dashboard's own static root, not /api/health
    # (which proxies the backend). Use 127.0.0.1 to avoid IPv6 localhost races.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Talk with JAI (Wave 2b): the Pipecat voice pipeline, in its own image with its own pinned packages. The
  # browser opens one WebSocket per conversation (published on this computer only). It has no authority of its
  # own: the operator's sign-in token goes with every backend call, and the backend runs every tool as him. Only
  # the OpenAI key is read from the backend's .env, mounted read-only; nothing secret is in the image.
  voice:
    build:
      context: ./services/voice
      dockerfile: Dockerfile
    container_name: jarv-voice
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_ENV_FILE: /run/jai/backend.env
      CHATTERBOX_URL: http://chatterbox:8770
      PIPECAT_ALLOWED_ORIGINS: ${PIPECAT_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - type: bind
        source: ./apps/backend/.env
        target: /run/jai/backend.env
        read_only: true
    depends_on:
      - backend
    networks:
      - jarv-network
      - jarv-voice
    restart: unless-stopped

  # Wave 3, research. JAI's search engine and page reader run on their own network (jarv-web) shared only with
  # the backend and worker, never published on this computer: nothing else can use them, and a page the browser
  # is sent to cannot reach JAI's database, Redis or Docker controls.
  # SearXNG (open source): asks Google, Bing, Brave, DuckDuckGo, Wikipedia, GitHub and more at once. Its image is
  # pinned to the exact build the installer pulled (SEARXNG_IMAGE in .env).
  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    container_name: jarv-searxng
    environment:
      # Set in .env by the research installer (never committed); without it SearXNG refuses to start.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: http://searxng:8080/
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./services/searxng:/etc/searxng:ro
      - searxng_data:/var/cache/searxng
    networks:
      - jarv-web
    restart: unless-stopped

  # Crawl4AI (open source, Apache 2.0): a headless browser that renders JavaScript pages and returns their main
  # content as Markdown, refusing to open private addresses. No model key: JAI's own model does the reading. Its
  # image is pinned to the exact build the installer pulled (CRAWL4AI_IMAGE in .env); its access token is
  # generated into .env and only JAI's backend and worker hold it.
  crawl4ai:
    image: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:latest}
    container_name: jarv-crawl4ai
    shm_size: "1g"
    # Capped so a heavy page can never starve JAI's other services (WSL shares one pool of memory).
    mem_limit: 2g
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
    networks:
      - jarv-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11235/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # JAI's natural voice: Chatterbox Turbo (open source, MIT), speaking in George's British voice from a reference
  # clip. Only the voice service can reach it (internal network, no internet; the model is in the image). On the
  # NVIDIA GPU when docker-compose.voice-gpu.yml is in COMPOSE_FILE, otherwise Chatterbox Nano on the processor.
  chatterbox:
    build:
      context: ./services/chatterbox
      dockerfile: Dockerfile
    container_name: jarv-chatterbox
    environment:
      DEFAULT_VOICE: george
    volumes:
      - voice_refs:/srv/voices:ro
    networks:
      - jarv-voice
    mem_limit: 4g
    restart: unless-stopped

  # Wave 4a, images: ComfyUI with FLUX.1-schnell on the NVIDIA GPU. Started only with the "images" profile (the
  # installer sets COMPOSE_PROFILES=images in .env after checking the GPU works), on an internal network shared only
  # with the backend and worker: it has no internet and nothing else can use it. Models live in their own volume.
  comfyui:
    profiles: ["images"]
    build:
      context: ./services/comfyui
      dockerfile: Dockerfile
    container_name: jarv-comfyui
    volumes:
      - comfyui_models:/opt/comfyui/models
    networks:
      - jarv-gpu
    mem_limit: 7g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Wave 4b, videos: MoneyPrinterTurbo (open source, MIT) behind JAI's small render API. JAI writes and narrates;
  # it gathers footage (JAI's images, or Pexels with PEXELS_API_KEY in .env), times subtitles and renders. It never
  # calls an AI provider. On JAI's research network (it needs the internet only for Pexels).
  moneyprinter:
    profiles: ["content"]
    build:
      context: ./services/moneyprinter
      dockerfile: Dockerfile
    container_name: jarv-moneyprinter
    environment:
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    networks:
      - jarv-web
    mem_limit: 3g
    restart: unless-stopped

  # Wave 4d, social drafts: Postiz (open source, AGPL-3.0) with its job scheduler, Temporal. Both use JAI's own
  # PostgreSQL (each its own database and its own user, created by the installer) and Redis. Postiz is published on
  # this computer only (http://localhost:4007), where Richard creates his account and connects his channels; JAI
  # writes drafts through its public API and never schedules or publishes.
  temporal:
    profiles: ["social"]
    image: temporalio/auto-setup:1.28.1
    container_name: jarv-temporal
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_NAMESPACE: default
      SQL_MAX_CONNS: "8"
      SQL_MAX_IDLE_CONNS: "2"
      SQL_VIS_MAX_CONNS: "2"
      SQL_VIS_MAX_IDLE_CONNS: "1"
    volumes:
      - ./services/postiz/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jarv-network
    mem_limit: 768m
    restart: unless-stopped

  postiz:
    profiles: ["social"]
    image: ${POSTIZ_IMAGE:-ghcr.io/gitroomhq/postiz-app:latest}
    container_name: jarv-postiz
    environment:
      MAIN_URL: http://localhost:4007
      FRONTEND_URL: http://localhost:4007
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4007/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${POSTIZ_JWT_SECRET:-}
      DATABASE_URL: postgresql://postiz:${POSTIZ_DB_PASSWORD:-}@postgres:5432/postiz
      REDIS_URL: redis://redis:6379/6
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      RUN_CRON: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      API_LIMIT: "60"
    env_file:
      - path: ./services/postiz/social.env
        required: false
    volumes:
      - postiz_config:/config
      - postiz_uploads:/uploads
    ports:
      - "127.0.0.1:4007:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - jarv-network
    mem_limit: 1536m
    restart: unless-stopped

  # Wave 5, code understanding: Serena (open source, MIT) gives JAI's agents an IDE's view of a codebase through
  # language servers (symbols, references, declarations, diagnostics). It sees the workspaces at the same paths as
  # JAI, runs with JAI's read-only context (no editing, no shell), and only the backend and worker reach it. It may
  # download a language's server the first time it reads that language.
  serena:
    profiles: ["code"]
    build:
      context: https://github.com/oraios/serena.git#v2.1.0
    container_name: jarv-serena
    # Serena keeps its notes about each project in its own volume (never inside Richard's folders, which it sees
    # read-only), offers one tool per operation, and runs without its web dashboard.
    entrypoint: ["/bin/sh", "-c"]
    command: ["sed -i 's#^project_serena_folder_location:.*#project_serena_folder_location: \"/serena-data$$projectDir/.serena\"#' \"$$SERENA_HOME/serena_config.yml\" && exec serena start-mcp-server --transport streamable-http --host 0.0.0.0 --port 9121 --context /jai/jai-context.yml --agent-interface tools --enable-web-dashboard False"]
    environment:
      SERENA_DOCKER: "1"
    volumes:
      - ./services/serena:/jai:ro
      - serena_home:/workspaces/serena/config
      - serena_data:/serena-data
      - type: bind
        source: ${WORKSPACE_MOUNT_SOURCE:-/mnt/c/Users/lilri/OneDrive/Desktop}
        target: /host/workspaces
        read_only: true
    networks:
      - jarv-code
    mem_limit: 2g
    restart: unless-stopped

  # JAI's engineering sandbox: the OpenHands Software Agent SDK (MIT) does each specialist's work package with a
  # full shell and file editor on the mission's workspace. Every command and file action is checked by the backend
  # first (/api/agent-gate/check); its model calls go only through JAI's gateway, inside the daily spending limit.
  # It sees only the workspaces folder (no Docker socket, no database, no provider key); the agent's shell runs as
  # an unprivileged user. On JAI's research network, so it can install packages from the official registries.
  openhands:
    profiles: ["engineer"]
    build:
      context: ./services/openhands
    container_name: jarv-openhands
    environment:
      OPENHANDS_TOKEN: ${OPENHANDS_TOKEN:-}
      JAI_GATEWAY_TOKEN: ${JAI_GATEWAY_TOKEN:-}
      JAI_BACKEND_URL: http://backend:8000
      WORKSPACE_ROOT: /host/workspaces
      OPENHANDS_MAX_RUNS: "4"
    volumes:
      - openhands_home:/home/openhands
      # The skill packs (Upgrades 1-5), pinned clones made by scripts/skill-packs.sh; read-only.
      - ./skill-packs:/jai/skills:ro
      - type: bind
        source: ${WORKSPACE_MOUNT_SOURCE:-/mnt/c/Users/lilri/OneDrive/Desktop}
        target: /host/workspaces
    networks:
      - jarv-web
    mem_limit: 4g
    restart: unless-stopped

  # Wave 6, documents: Docling (MIT, IBM Research) reads PDFs, Word, PowerPoint, Excel and scans (OCR) into text.
  # Its models are inside the image; it has no route to the internet, so no document leaves this computer.
  docling:
    profiles: ["docs"]
    image: ${DOCLING_IMAGE:-ghcr.io/docling-project/docling-serve-cpu:v1.38.2}
    container_name: jarv-docling
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: "900"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      OMP_NUM_THREADS: "4"
    networks:
      - jarv-knowledge
    mem_limit: 3g
    restart: unless-stopped

  # Wave 6, the browser: browser-use (MIT) with Chromium, driven one action at a time by JAI's agents. Public pages
  # only, no sign-ins, never passwords, card or bank details (services/browser/server.py).
  browser:
    profiles: ["browser"]
    build:
      context: ./services/browser
    container_name: jarv-browser
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}
      BROWSER_MAX_SESSIONS: "2"
    networks:
      - jarv-web
    shm_size: 1g
    mem_limit: 2g
    restart: unless-stopped

  # Wave 6, knowledge: Graphiti's knowledge graph (on embedded FalkorDB Lite) and Mem0's memory of Richard (on JAI's
  # PostgreSQL). Both use a model only through JAI's model gateway, inside the daily spending limit.
  knowledge:
    profiles: ["knowledge"]
    build:
      context: ./services/knowledge
    container_name: jarv-knowledge
    environment:
      KNOWLEDGE_TOKEN: ${KNOWLEDGE_TOKEN:-}
      JAI_GATEWAY_TOKEN: ${JAI_GATEWAY_TOKEN:-}
      JAI_GATEWAY_URL: http://backend:8000/api/gateway/v1
      MEM0_DB_HOST: postgres
      MEM0_DB: mem0
      MEM0_DB_USER: mem0
      MEM0_DB_PASSWORD: ${MEM0_DB_PASSWORD:-}
    volumes:
      - knowledge_data:/data
    # jarv-network for PostgreSQL, where Mem0 keeps its vectors in its own database (it holds no provider key).
    networks:
      - jarv-knowledge
      - jarv-network
    mem_limit: 1536m
    restart: unless-stopped

  # Wave 6, prompt checks: promptfoo (MIT) checks JAI's prompts and every self-evolved agent instruction against
  # Richard's hard boundaries. Its model calls go only to JAI's gateway, with JAI's gateway token as its key.
  promptfoo:
    profiles: ["evals"]
    build:
      context: ./services/promptfoo
    container_name: jarv-promptfoo
    environment:
      PROMPTFOO_TOKEN: ${PROMPTFOO_TOKEN:-}
      OPENAI_API_KEY: ${JAI_GATEWAY_TOKEN:-}
      OPENAI_BASE_URL: http://backend:8000/api/gateway/v1
      OPENAI_API_BASE_URL: http://backend:8000/api/gateway/v1
    networks:
      - jarv-knowledge
    mem_limit: 1g
    restart: unless-stopped

  # Celery Worker
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        JARV_UID: ${JARV_UID:-1000}
        JARV_GID: ${JARV_GID:-1000}
    container_name: jarv-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jarv}:${POSTGRES_PASSWORD:-jarv_password}@postgres:5432/${POSTGRES_DB:-jarv}
      REDIS_URL: redis://redis:6379/0
      CRAWL4AI_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      # Wave 6: the tokens of JAI's model gateway and of its document, browser, knowledge and prompt-check services.
      JAI_GATEWAY_TOKEN: ${JAI_GATEWAY_TOKEN:-}
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}
      KNOWLEDGE_TOKEN: ${KNOWLEDGE_TOKEN:-}
      PROMPTFOO_TOKEN: ${PROMPTFOO_TOKEN:-}
      OPENHANDS_TOKEN: ${OPENHANDS_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Missions run here, so the worker sees the same workspaces as the backend.
      JARV_PROCESS_ROLE: worker
      WORKSPACE_HOST_ROOT: ${WORKSPACE_HOST_ROOT:-C:\\Users\\lilri\\OneDrive\\Desktop}
      WORKSPACE_CONTAINER_ROOT: /host/workspaces
      DOCKER_OPS_URL: http://docker-proxy:2375
      BACKUP_DIR: /data/backups
      JARV_API_URL: http://backend:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/backend:/app
      - ./skill-packs:/data/skill-packs:ro
      - backups:/data/backups
      - tool_home:/home/jarv
      - type: bind
        source: ${WORKSPACE_MOUNT_SOURCE:-/mnt/c/Users/lilri/OneDrive/Desktop}
        target: /host/workspaces
    networks:
      - jarv-network
      - jarv-ops
      - jarv-web
      - jarv-gpu
      - jarv-voice
      - jarv-code
      - jarv-knowledge
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    # Celery worker liveness: ping the worker over the broker (not HTTP — this
    # container runs Celery, not the uvicorn server the base image probes).
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Celery Beat Scheduler
  scheduler:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        JARV_UID: ${JARV_UID:-1000}
        JARV_GID: ${JARV_GID:-1000}
    container_name: jarv-scheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jarv}:${POSTGRES_PASSWORD:-jarv_password}@postgres:5432/${POSTGRES_DB:-jarv}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JARV_PROCESS_ROLE: worker
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/backend:/app
    networks:
      - jarv-network
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    # Celery beat liveness: beat does not answer `inspect ping`, so verify the
    # beat process itself is running (not HTTP — the base image probes uvicorn).
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'beat' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Local Runner Service (optional, for local development)
  local-runner:
    build:
      context: ./services/local-runner
      dockerfile: Dockerfile
    container_name: jarv-local-runner
    environment:
      BACKEND_URL: http://backend:8000
      RUNNER_TOKEN: ${RUNNER_TOKEN:-dev-runner-token}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    depends_on:
      - backend
    volumes:
      - ./services/local-runner:/app
      # Mount approved folders for local file access (configure as needed)
      # - /path/to/approved/folder:/workspaces
    networks:
      - jarv-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  voice_models:
    driver: local
  backups:
    driver: local
  voice_audio:
    driver: local
  tool_home:
    driver: local
  searxng_data:
    driver: local
  voice_refs:
    name: jai_voice_refs
  comfyui_models:
    name: jai_comfyui_models
  postiz_config:
    driver: local
  postiz_uploads:
    driver: local
  serena_home:
    name: jai_serena_home
  serena_data:
    name: jai_serena_data
  openhands_home:
    name: jai_openhands_home
  knowledge_data:
    name: jai_knowledge_data

networks:
  jarv-network:
    driver: bridge
  # Internal-only network between JARV and the Docker proxy (no outside route).
  jarv-ops:
    driver: bridge
    internal: true
  # JAI's research network (Wave 3): the backend, the worker, SearXNG and Crawl4AI only; it reaches the internet.
  jarv-web:
    driver: bridge
  # JAI's voice and its natural-speech service only, with no route to the internet.
  jarv-voice:
    driver: bridge
    internal: true
  # JAI's image generator (Wave 4a): the backend, the worker and ComfyUI only, with no route to the internet.
  jarv-gpu:
    driver: bridge
    internal: true
  # JAI's code understanding (Wave 5): the backend, the worker and Serena (which may fetch language servers).
  jarv-code:
    driver: bridge
  # JAI's knowledge network (Wave 6), with no route to the internet: the backend, the worker, Docling, the knowledge
  # service and promptfoo. Their model calls reach OpenAI only through the backend's gateway.
  jarv-knowledge:
    driver: bridge
    internal: true
