# Production Docker Compose Configuration for JARV
# No version needed for Compose V2 (Docker Compose plugin)

services:
  # PostgreSQL Database with pgvector
  postgres:
    image: ankane/pgvector:latest
    container_name: jarv-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-E UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jarv-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching and job queue
  redis:
    image: redis:7-alpine
    container_name: jarv-redis-prod
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      # Redis requires the password, so the health check authenticates too.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jarv-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Restricted Docker API for JARV's self-healing (Repair 12d). Exposes only
  # container list/inspect/logs and restart; image, exec, volume, network and
  # all other write endpoints stay denied (POST=0). Reachable only from the
  # internal jarv-ops network (backend and worker), never published to the host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: jarv-docker-proxy-prod
    environment:
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jarv-ops
    restart: always

  # FastAPI Backend
  # Database migrations: runs `alembic upgrade head` once and exits. The backend, worker,
  # scheduler and cloud runner start only after it succeeds, so a fresh server gets its schema
  # and every upgrade applies its migrations before new code serves requests.
  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: jarv-migrate-prod
    command: python -m alembic upgrade head
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jarv-network
    restart: "no"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_WORKERS: 4
      SENTRY_DSN: ${SENTRY_DSN:-}
      DOCKER_OPS_URL: http://docker-proxy:2375
      BACKUP_DIR: /data/backups
      DEPLOY_SSH_HOST: ${DEPLOY_SSH_HOST:-}
      DEPLOY_SSH_USER: ${DEPLOY_SSH_USER:-deploy}
      DEPLOY_SSH_PORT: ${DEPLOY_SSH_PORT:-22}
      DEPLOY_SSH_PRIVATE_KEY: ${DEPLOY_SSH_PRIVATE_KEY:-}
      DEPLOY_SSH_KNOWN_HOSTS: ${DEPLOY_SSH_KNOWN_HOSTS:-}
      DEPLOY_BASE_DIR: ${DEPLOY_BASE_DIR:-/srv/jarv}
      # Revenue, infrastructure money and voice (Repairs 12e-4b/4c). Unset keys leave the adapter disabled.
      INFRA_FIXED_COSTS: ${INFRA_FIXED_COSTS:-}
      INFRA_MONTHLY_BUDGET: ${INFRA_MONTHLY_BUDGET:-0}
      INFRA_REPLICA_MONTHLY_COST: ${INFRA_REPLICA_MONTHLY_COST:-0}
      INFRA_MAX_REPLICAS: ${INFRA_MAX_REPLICAS:-5}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLAUSIBLE_API_KEY: ${PLAUSIBLE_API_KEY:-}
      PLAUSIBLE_SITE_ID: ${PLAUSIBLE_SITE_ID:-}
      APP_STORE_COUNTRY: ${APP_STORE_COUNTRY:-us}
      STT_PROVIDER: ${STT_PROVIDER:-auto}
      TTS_PROVIDER: ${TTS_PROVIDER:-auto}
      VOICEBOX_BASE_URL: ${VOICEBOX_BASE_URL:-}
      VOICEBOX_PROFILE_ID: ${VOICEBOX_PROFILE_ID:-}
      VOICEBOX_STT_MODEL: ${VOICEBOX_STT_MODEL:-small}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-cedar}
      OPENAI_REALTIME_TRANSCRIBE_MODEL: ${OPENAI_REALTIME_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      VOICE_AUDIO_DIR: /data/voice-audio
      # Model routing, email, notifications and asset libraries (Repair 14b). Unset leaves each disabled.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PROVIDER_ORDER: ${PROVIDER_ORDER:-claude,openai,gemini,ollama}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-sonnet-4-6}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_USER_TOKEN: ${SLACK_USER_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - backups:/data/backups
      - voice_audio:/data/voice-audio
    networks:
      - jarv-network
      - jarv-ops
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Next.js Dashboard Frontend
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - jarv-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      replicas: 2
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Celery Worker
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      JARV_PROCESS_ROLE: worker
      DOCKER_OPS_URL: http://docker-proxy:2375
      BACKUP_DIR: /data/backups
      DEPLOY_SSH_HOST: ${DEPLOY_SSH_HOST:-}
      DEPLOY_SSH_USER: ${DEPLOY_SSH_USER:-deploy}
      DEPLOY_SSH_PORT: ${DEPLOY_SSH_PORT:-22}
      DEPLOY_SSH_PRIVATE_KEY: ${DEPLOY_SSH_PRIVATE_KEY:-}
      DEPLOY_SSH_KNOWN_HOSTS: ${DEPLOY_SSH_KNOWN_HOSTS:-}
      DEPLOY_BASE_DIR: ${DEPLOY_BASE_DIR:-/srv/jarv}
      # Revenue, infrastructure money and voice (Repairs 12e-4b/4c). Unset keys leave the adapter disabled.
      INFRA_FIXED_COSTS: ${INFRA_FIXED_COSTS:-}
      INFRA_MONTHLY_BUDGET: ${INFRA_MONTHLY_BUDGET:-0}
      INFRA_REPLICA_MONTHLY_COST: ${INFRA_REPLICA_MONTHLY_COST:-0}
      INFRA_MAX_REPLICAS: ${INFRA_MAX_REPLICAS:-5}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLAUSIBLE_API_KEY: ${PLAUSIBLE_API_KEY:-}
      PLAUSIBLE_SITE_ID: ${PLAUSIBLE_SITE_ID:-}
      APP_STORE_COUNTRY: ${APP_STORE_COUNTRY:-us}
      STT_PROVIDER: ${STT_PROVIDER:-auto}
      TTS_PROVIDER: ${TTS_PROVIDER:-auto}
      VOICEBOX_BASE_URL: ${VOICEBOX_BASE_URL:-}
      VOICEBOX_PROFILE_ID: ${VOICEBOX_PROFILE_ID:-}
      VOICEBOX_STT_MODEL: ${VOICEBOX_STT_MODEL:-small}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-cedar}
      OPENAI_REALTIME_TRANSCRIBE_MODEL: ${OPENAI_REALTIME_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      VOICE_AUDIO_DIR: /data/voice-audio
      # Model routing, email, notifications and asset libraries (Repair 14b). Unset leaves each disabled.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PROVIDER_ORDER: ${PROVIDER_ORDER:-claude,openai,gemini,ollama}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-sonnet-4-6}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_USER_TOKEN: ${SLACK_USER_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      JARV_API_URL: http://backend:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - backups:/data/backups
      - voice_audio:/data/voice-audio
    networks:
      - jarv-network
      - jarv-ops
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=100
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      replicas: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Celery Beat Scheduler
  scheduler:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: jarv-scheduler-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      JARV_PROCESS_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - jarv-network
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Local Runner Service (Cloud Runner for 24/7 operation)
  cloud-runner:
    build:
      context: ./services/local-runner
      dockerfile: Dockerfile
    container_name: jarv-cloud-runner-prod
    environment:
      BACKEND_URL: http://backend:8000
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: production
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - backend
    networks:
      - jarv-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Nginx Reverse Proxy (Production Load Balancer)
  nginx:
    image: nginx:alpine
    container_name: jarv-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - dashboard
    networks:
      - jarv-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local
  backups:
    driver: local
  voice_audio:
    driver: local

networks:
  # Internal-only network between JARV and the Docker proxy (no outside route).
  jarv-ops:
    driver: bridge
    internal: true
  jarv-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
