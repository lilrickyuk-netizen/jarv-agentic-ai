; MYCO's local PgBouncer pooler (spec Phase 2) in front of the three database authorities. Transaction pooling,
; as CloudNativePG's Pooler uses by default. The users and their passwords are written at start from the container's
; environment into /tmp/userlist.txt; none is kept in this file. Migrations connect to myco-postgres directly.
[databases]
myco_global = host=myco-postgres port=5432 dbname=myco_global
myco_cell_local_c0001 = host=myco-postgres port=5432 dbname=myco_cell_local_c0001
keycloak = host=myco-postgres port=5432 dbname=keycloak

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
pool_mode = transaction
max_client_conn = 400
default_pool_size = 10
min_pool_size = 0
reserve_pool_size = 2
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
max_prepared_statements = 200
log_connections = 0
log_disconnections = 0
