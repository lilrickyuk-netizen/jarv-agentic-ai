# JARV Prometheus configuration (Repair 12b).
# Started by docker-compose.monitoring.yml alongside the main stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: 'jarv'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Backend: HTTP metrics for the API process, plus mission, worker, agent,
  # tool, approval, memory, and lesson metrics read from the database and
  # broker (missions run on the workers; their state is measured here).
  # If METRICS_TOKEN is set on the backend, uncomment `authorization` and put
  # the same token in infra/monitoring/secrets/metrics_token.
  - job_name: 'jarv-backend'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['backend:8000']
    # authorization:
    #   credentials_file: /etc/prometheus/secrets/metrics_token

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
