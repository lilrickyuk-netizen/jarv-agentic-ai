# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name _;

    # Health check endpoint (allow HTTP)
    location /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body size limit
    client_max_body_size 10M;

    # Dashboard (Next.js frontend)
    location / {
        limit_req zone=dashboard_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # The dashboard's own API routes: its signed-in proxy to the backend (/api/backend/...) and its
    # health route. These are Next.js routes, so they go to the dashboard, not straight to FastAPI.
    # Voice recordings upload through here (the backend accepts up to 25 MB) and missions can run
    # long, hence the larger body size and timeouts.
    location ^~ /api/backend/ {
        limit_req zone=dashboard_limit burst=40 nodelay;
        limit_conn conn_limit 20;
        client_max_body_size 30M;

        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 660s;
    }

    location = /api/health {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Everything else under /api goes straight to the backend: the Stripe webhook, the alert webhook,
    # calendar feed links and the hands-free wake-word WebSocket. CORS is answered by the backend's
    # own allow-list (ALLOWED_ORIGINS); nginx adds no CORS headers of its own.
    location ^~ /api {
        limit_req zone=api_limit burst=10 nodelay;
        limit_conn conn_limit 5;
        client_max_body_size 30M;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for API (the wake-word WebSocket stays open while hands-free is on)
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 3600s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://dashboard;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
